name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project
        run: |
          echo "Repository files:"
          ls -la
          PROJECT_DIR=""
          if [ -f settings.gradle.kts ]; then
            PROJECT_DIR="."
          else
            i=0
            for z in ./*.zip; do
              [ -f "$z" ] || continue
              i=$((i+1))
              mkdir -p "_proj/$i"
              unzip -q -o "$z" -d "_proj/$i" || continue
              found="$(find "_proj/$i" -name settings.gradle.kts | head -n1)"
              if [ -n "$found" ]; then
                PROJECT_DIR="$(dirname "$found")"
                break
              fi
            done
          fi
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Project not found. Put the unpacked project (settings.gradle.kts in the repo root) or CompanionAndroid.zip into the repository root."
            exit 1
          fi
          echo "Project dir: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Companion-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
